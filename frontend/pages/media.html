<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediaTrack</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/media.css">

</head>

<body class="media-page">

    <!-- Navigation -->

    <nav class="app-nav">
        <div class="nav-brand">
            <img src="../assets/logo.png" alt="MediaTrack">
            <span>MediaTrack</span>
        </div>

        <ul class="nav-links">
            <li><a href="home.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="watchlist.html">Watchlist</a></li>
            <li><a href="calendar.html">Calendar</a></li>
        </ul>

        <div class="nav-avatar">F</div>
    </nav>

    <!-- Header -->

    <section class="media-header">

        <h1 id="pageTitle">
            Movies
        </h1>

        <p id="pageSubtitle">
            Explore your collection.
        </p>

    </section>

    <!-- Search -->

    <section class="media-search">

        <input type="text" id="searchBox" placeholder="Search...">

    </section>

    <!-- Grid -->

    <section class="media-grid" id="mediaGrid">

    </section>
    <div id="mediaModal" class="media-modal">

        <div class="modal-content">

            <span id="closeModal">&times;</span>

            <img id="modalPoster">

            <h2 id="modalTitle"></h2>

            <p id="modalMeta"></p>

            <p id="modalDescription"></p>

            <div class="modal-buttons">

                <button>⭐ Favourite</button>

                <button>📝 Log</button>

                <button id="watchlistBtn">
                    ➕ Add to Watchlist
                </button>

                <button>▶ Watching</button>

            </div>

        </div>

    </div>

    <script src="../js/media.js"></script>

</body>

</html>
